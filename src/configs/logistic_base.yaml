defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

seed: 42
repeats: 100
n_jobs: 8
output_dir: output/logistic

function:
  _target_: src.functions.LogisticRegression
  train_size: 512
  validation_size: 256
  test_size: 512
  data_seed: 2026
  standardize: false
  batch_size: 64
  noise_std: 0.25

hydra:
  output_subdir: null
  run:
    dir: ${output_dir}
